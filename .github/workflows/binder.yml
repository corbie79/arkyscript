name: C++20 Lua binder
on:
  push:
    paths:
      - 'binder/**'
      - 'runtime/task/**'
      - 'tests/task/**'
      - 'examples/cpp_*.cpp'
      - 'tests/binder/**'
      - 'scripts/test_binder.py'
      - 'scripts/bootstrap.py'
      - 'scripts/build_common.py'
      - 'dependencies.json'
      - '.github/workflows/binder.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build pinned official LuaJIT
        run: PYTHONPATH=scripts python3 -c 'from bootstrap import build_native; build_native()'
      - run: make binder-test
      - run: make binder-sanitize
