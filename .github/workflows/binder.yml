name: C++20 Lua binder
on:
  push:
    paths:
      - 'binder/**'
      - 'examples/cpp_*.cpp'
      - 'tests/binder/**'
      - 'scripts/test_binder.py'
      - 'scripts/bootstrap.py'
      - 'scripts/build_common.py'
      - 'dependencies.json'
      - '.github/workflows/binder.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned official LuaJIT
        run: PYTHONPATH=scripts python3 -c 'from bootstrap import build_native; build_native()'
      - run: make binder-test
      - run: make binder-sanitize
