[package]
name = "tynex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "arky"
path = "src/main.rs"

[dependencies]
tynex-compiler = { path = "../tynex-compiler" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
globset = "0.4"
tempfile = "3"
url = "2.5"
